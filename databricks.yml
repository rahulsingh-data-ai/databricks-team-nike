bundle:
  name: "team-nike-hackathon"

sync:
  include:
    - .build
    - pipelines

artifacts:
  default:
    build: apx build

variables:
  bronze_schema:
    description: "Bronze (source) catalog.schema for raw facilities/pincode/NFHS-5 data"
    default: "development.dev_gps_research_insights"
  target_schema:
    description: "Target Delta catalog.schema for silver/gold tables"
    default: "development.dev_gps_research_insights"
  warehouse_id:
    description: "SQL warehouse used by notebook tasks (when needed)"
    default: "650f801e25d4c0cc"

resources:
  apps:
    team-nike-hackathon-app:
      name: "team-nike-hackathon"
      description: "team-nike-hackathon created with apx"
      source_code_path: ./.build
  jobs:
    referral_copilot_etl:
      name: "[${bundle.target}] referral_copilot_etl"
      tasks:
        - task_key: etl_pipeline
          notebook_task:
            notebook_path: ./pipelines/etl_pipeline.py
            base_parameters:
              bronze_schema: ${var.bronze_schema}
              target_schema: ${var.target_schema}
              vs_index: ""  # set later when we create a vector index
        # nominatim_refine task disabled \u2014 references old column names
        # (`pincode_status`, `state_resolved`, ...) that no longer exist on
        # ``facilities_gold``. Re-enable after porting the script to the new
        # schema (use ``pincode_confidence`` / ``needs_geo_review`` instead).
      queue:
        enabled: true

targets:
  dev:
    mode: development
    default: true

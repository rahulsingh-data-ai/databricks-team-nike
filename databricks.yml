bundle:
  name: "team-nike-hackathon"

sync:
  include:
    - .build

artifacts:
  default:
    build: apx build

resources:
  database_instances:
    team-nike-hackathon-db:
      name: "team-nike-hackathon"
      capacity: "CU_1"
  apps:
    team-nike-hackathon-app:
      name: "team-nike-hackathon"
      description: "team-nike-hackathon created with apx"
      source_code_path: ./.build
      resources:
        - name: "db"
          database:
            database_name: "databricks_postgres"
            instance_name: ${resources.database_instances.team-nike-hackathon-db.name}
            permission: "CAN_CONNECT_AND_CREATE"

targets:
  dev:
    mode: development
    default: true

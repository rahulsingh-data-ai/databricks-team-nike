bundle:
  name: "team-nike-hackathon"

sync:
  include:
    - .build

artifacts:
  default:
    build: apx build

# NOTE: Lakebase (database_instances + app `database` resource) is intentionally
# not declared here. The bundled CLI does not yet support those fields, so the
# Lakebase database instance is created via the Databricks UI and referenced at
# runtime through the PGAPPNAME env var in .env. Once the CLI catches up, this
# block can be reinstated:
#
#   resources:
#     database_instances:
#       team-nike-hackathon-db:
#         name: "team-nike-hackathon"
#         capacity: "CU_1"
#     apps:
#       team-nike-hackathon-app:
#         ...
#         resources:
#           - name: "db"
#             database:
#               database_name: "databricks_postgres"
#               instance_name: ${resources.database_instances.team-nike-hackathon-db.name}
#               permission: "CAN_CONNECT_AND_CREATE"

resources:
  apps:
    team-nike-hackathon-app:
      name: "team-nike-hackathon"
      description: "team-nike-hackathon created with apx"
      source_code_path: ./.build

targets:
  dev:
    mode: development
    default: true
